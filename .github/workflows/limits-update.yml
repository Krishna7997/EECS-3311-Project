# F15: weekly check of the CRA contribution limits.
# Builds MapleCFO, runs the LimitsUpdateJob and, if the limits changed and passed validation,
# opens a pull request so a person reviews the new numbers before the app downloads them.
name: Contribution limits update

on:
  schedule:
    - cron: "17 13 * * 1"   # Mondays 13:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check-limits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build
        run: mvn -q -B -DskipTests package
      - name: Check the CRA page
        id: job
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          java -cp target/maplecfo.jar com.maplecfo.automation.limits.LimitsUpdateJob src/main/resources/contribution_limits.json
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "2" ]; then exit 1; fi
          exit 0
      - name: Open a pull request with the new limits
        if: steps.job.outputs.code == '10'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="limits-update-$(date +%Y%m%d)"
          git config user.name "maplecfo-limits-bot"
          git config user.email "maplecfo-limits-bot@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/main/resources/contribution_limits.json
          git commit -m "Update contribution limits from the CRA page"
          git push origin "$branch"
          gh pr create --title "Update contribution limits" \
            --body "The weekly bot found new TFSA/RRSP limits on the CRA page. They passed validation. Please check them against the CRA page before merging." \
            --base main --head "$branch"
